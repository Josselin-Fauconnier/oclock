  <!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minuteur</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
 

  <main class="timer-wrap">
    <h1>Minuteur</h1>
    <section class="timer-card" aria-label="Minuteur">
      <div class="time-display" id="time-display" aria-live="polite">00:00</div>

      <div class="controls-row">
        <div class="arrows">
          <button class="btn arrow green" id="inc-btn" aria-label="Augmenter le temps">▲</button>
          <button class="btn arrow red" id="dec-btn" aria-label="Diminuer le temps">▼</button>
        </div>

        <div class="setters">
          <label for="time-input" class="label">Entrer un temps</label>
          <input id="time-input" class="time-input" inputmode="numeric" placeholder=" ex: 10:00:00 ,10:00,10" aria-describedby="hint-format"/>
          <div id="hint-format" class="hint">Formats acceptés : ss, mm:ss ou hh:mm:ss</div>
        </div>
      </div>

      <div class="setters">
        <label for="step-select" class="label">Incrément (secondes)</label>
        <select id="step-select" class="time-input">
          <option value="5">5 secondes</option>
          <option value="15">15 secondes</option>
          <option value="30">30 secondes</option>
          <option value="60" selected>1 minute</option>
        </select>
      </div>

      <div class="actions-row">
        <button class="btn primary" id="toggle-btn">Démarrer</button>
        <button class="btn ghost" id="reset-btn">Réinitialiser</button>
      </div>

      <div class="setters">
        <label for="alert-input" class="label">Texte de l'alerte</label>
        <input id="alert-input" class="time-input" placeholder="Message à afficher à la fin" value="Temps écoulé"/>
      </div>
    </section>

    <nav class="back-link">
      <a href="index.html">Retour à l'index</a>
    </nav>
  </main>

  <div class="alert-backdrop hidden" id="alert-backdrop" role="dialog" aria-modal="true" aria-labelledby="alert-title">
    <div class="alert-modal">
      <h2 id="alert-title">Alerte</h2>
      <p id="alert-text">Temps écoulé</p>
      <div class="actions-row">
        <button class="btn primary" id="alert-close">OK</button>
      </div>
    </div>
  </div>

  <script src="JS/minuteur.js" defer></script>
</body>
</html>
