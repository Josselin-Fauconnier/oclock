    <!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Réveil</title>
        <link rel="manifest" href="manifest.json">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="timer-wrap">
            <h1>Réveil</h1>
    <section class="timer-card" aria-label="Réveil">
      <div class="time-display" id="now-display" aria-live="polite">--:--:--</div>

      <div class="setters">
        <label for="alarm-time" class="label">Heure de l'alarme</label>
        <input id="alarm-time" class="time-input" placeholder="HH:MM ou HH:MM:SS" inputmode="numeric" />
      </div>

      <div class="setters">
        <label for="alarm-text" class="label">Texte de l'alerte</label>
        <input id="alarm-text" class="time-input" placeholder="Message à afficher" />
      </div>

      <div class="actions-row">
        <button class="btn primary" id="add-alarm">Ajouter l'alarme</button>
        <button class="btn ghost" id="clear-past">Effacer les alarmes passées</button>
      </div>

      <div class="setters">
        <label class="label">Alarmes</label>
        <ul id="alarms" class="time-input" aria-live="polite" style="list-style:none; padding:10px; margin:0; max-height:220px; overflow:auto;"></ul>
      </div>
    </section>

    <nav class="back-link">
      <a href="index.html">Retour à l'index</a>
    </nav>
  </main>

  <div class="alert-backdrop hidden" id="alert-backdrop" role="dialog" aria-modal="true" aria-labelledby="alert-title">
    <div class="alert-modal">
      <h2 id="alert-title">Alarme</h2>
      <p id="alert-text">Débout</p>
      <div class="actions-row">
        <button class="btn primary" id="alert-close">OK</button>
      </div>
    </div>
  </div>

  <script src="JS/reveil.js" defer></script>
        
    </body>
    </html>
